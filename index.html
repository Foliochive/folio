<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Folio — the photobook catalog</title>
<style>
:root{--bg:#faf8f4;--card:#fff;--ink:#1d1b18;--mut:#6f6a62;--line:#e4dfd6;--acc:#b3341f}
@media(prefers-color-scheme:dark){:root{--bg:#16150f;--card:#201e18;--ink:#f1ede4;--mut:#a39d90;--line:#37342b;--acc:#ec7a62;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
h1{margin:0;font-size:26px}h1 span{color:var(--acc)}
#q{flex:1;min-width:200px;padding:10px 14px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
nav{display:flex;gap:6px;padding:10px 20px;overflow-x:auto;border-bottom:1px solid var(--line)}nav button{white-space:nowrap}
button{font:14px system-ui,sans-serif;padding:7px 12px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;cursor:pointer}
button.on,button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
main{max-width:1000px;margin:0 auto;padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px}
.card{cursor:pointer}.card h3{margin:8px 0 0;font-size:15px}.card p{margin:0;color:var(--mut);font:13px system-ui,sans-serif}
.cv{aspect-ratio:4/5;border-radius:4px;display:flex;align-items:flex-end;padding:10px;color:#fff;font-weight:bold;font-size:15px;box-shadow:0 2px 8px #0003;overflow:hidden;background-size:cover}
.row{display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.row .cv{width:60px;flex:none;font-size:9px;padding:4px}.row .info{flex:1;min-width:180px}
.sub{color:var(--mut);font:13px system-ui,sans-serif}
form{display:grid;gap:10px;max-width:480px;margin:14px 0}
label{font:13px system-ui,sans-serif;color:var(--mut);display:grid;gap:4px}
input{padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
.hero{display:flex;gap:24px;flex-wrap:wrap}.hero .cv{width:200px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font:14px system-ui,sans-serif;opacity:0;transition:.25s;pointer-events:none;max-width:90%}
#toast.s{opacity:1}
.note{background:var(--card);border:1px solid var(--line);padding:10px 14px;border-radius:8px;font:13px system-ui,sans-serif;color:var(--mut)}
</style></head><body>
<header><h1>Fol<span>io</span></h1><input id="q" type="search" placeholder="Search title, photographer, publisher or ISBN…"></header>
<nav id="nav"></nav><main id="app"><p class="sub">Loading…</p></main><input id="cf" type="file" accept="image/*" hidden><div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const sb=supabase.createClient("https://jsxygqzllyneviurrpip.supabase.co","sb_publishable_eLqiVN4Zq1Ft8PH-T1j3og_L7e_CUyv");
let books=[],shelf=[],listings=[],user=null,view="browse",cur=null,q="";
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("s");setTimeout(()=>t.classList.remove("s"),2800)}
const fail=e=>{console.error(e);toast(e.message||"Something went wrong")};
const eds=()=>books.flatMap(b=>(b.editions||[]).map(e=>({...e,b})));
const edById=id=>eds().find(e=>e.id===id);
const cover=(e,b)=>{const h=[...b.title].reduce((a,c)=>a+c.charCodeAt(0),0)%360;return e&&e.cover_url?`<div class="cv" style="background-image:url(${esc(e.cover_url)})"></div>`:`<div class="cv" style="background:hsl(${h},35%,30%)">${esc(b.title)}</div>`};
const match=b=>{if(!q)return true;return (b.title+b.photographer+(b.editions||[]).map(e=>(e.publisher||"")+(e.isbn||"")+(e.year||"")).join(" ")).toLowerCase().includes(q.toLowerCase())};
const bc=b=>{const E=b.editions||[];return cover(E.find(e=>e.cover_url)||E[0],b)};
function shrink(file){return new Promise((ok,no)=>{const r=new FileReader();r.onerror=()=>no(new Error("Couldn’t read that image"));r.onload=()=>{const i=new Image();i.onerror=()=>no(new Error("That file isn’t a usable image"));i.onload=()=>{const k=Math.min(1,600/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext("2d").drawImage(i,0,0,c.width,c.height);c.toBlob(b=>b?ok(b):no(new Error("Image conversion failed")),"image/jpeg",.8)};i.src=r.result};r.readAsDataURL(file)})}
async function uploadCover(file){const blob=await shrink(file),path=user.id+"/"+crypto.randomUUID()+".jpg";const u=await sb.storage.from("covers").upload(path,blob,{contentType:"image/jpeg"});if(u.error)throw u.error;return sb.storage.from("covers").getPublicUrl(path).data.publicUrl}
let pendingEd=null;
const has=(id,k)=>shelf.some(s=>s.edition_id===id&&s.kind===k);
const edRow=(e,x="")=>`<div class="row">${cover(e,e.b)}<div class="info"><b>${esc(e.b.title)}</b><div class="sub">${esc(e.b.photographer)} · ${esc(e.publisher)}, ${esc(e.year)}${e.isbn?" · ISBN "+esc(e.isbn):""}</div></div>${x}</div>`;
async function refresh(){
 const b=await sb.from("books").select("*, editions(*)").order("title");if(b.error)return fail(b.error);books=b.data;
 const l=await sb.from("listings").select("*").order("created_at",{ascending:false});listings=l.data||[];
 shelf=[];if(user){const s=await sb.from("shelf").select("edition_id,kind");shelf=s.data||[]}
 render()}
function nav(){const t={browse:"Browse",have:`Collection (${shelf.filter(s=>s.kind==="have").length})`,want:`Wantlist (${shelf.filter(s=>s.kind==="want").length})`,market:"Marketplace",add:"Add a book",auth:user?"Account":"Sign in"};
 $("#nav").innerHTML=Object.entries(t).map(([k,v])=>`<button data-go="${k}" class="${view===k?"on":""}">${v}</button>`).join("")}
function render(){nav();const a=$("#app");
 if(view==="browse"){const r=books.filter(match);a.innerHTML=`<p class="sub">${r.length} book${r.length==1?"":"s"}</p><div class="grid">${r.map(b=>`<div class="card" data-book="${b.id}">${bc(b)}<h3>${esc(b.title)}</h3><p>${esc(b.photographer)} · ${(b.editions||[]).length} edition${(b.editions||[]).length==1?"":"s"}</p></div>`).join("")||"<p>Nothing found.</p>"}</div>`}
 else if(view==="book"){const b=books.find(x=>x.id===cur);if(!b){view="browse";return render()}
  a.innerHTML=`<button data-go="browse">← Back</button><div class="hero" style="margin-top:14px">${bc(b)}<div><h2 style="margin:0">${esc(b.title)}</h2><p class="sub">${esc(b.photographer)}</p></div></div><h3>Editions</h3>`+
  (b.editions||[]).sort((x,y)=>(x.year||0)-(y.year||0)).map(e=>edRow({...e,b},`<div><button data-have="${e.id}">${has(e.id,"have")?"✓ Have":"I have it"}</button> <button data-want="${e.id}">${has(e.id,"want")?"✓ Wanted":"Want"}</button> <button data-sell="${e.id}">Sell</button>${user&&!e.cover_url?` <button data-cover="${e.id}">Add cover</button>`:""}</div>`)+(e.notes?`<div class="sub" style="margin-top:-6px">${esc(e.notes)}</div>`:"")).join("")+
  `<h3>Add an edition</h3>${user?`<form id="ef"><label>Year<input name="y" type="number" required></label><label>Publisher<input name="p" required></label><label>ISBN (optional)<input name="isbn"></label><label>Notes<input name="n"></label><label>Cover photo (optional)<input name="c" type="file" accept="image/*"></label><button class="pri">Submit edition</button></form>`:`<p class="note">Sign in to add editions.</p>`}`}
 else if(view==="have"||view==="want"){if(!user){a.innerHTML=`<p class="note">Sign in to keep a collection and wantlist.</p>`;return}
  const l=shelf.filter(s=>s.kind===view).map(s=>edById(s.edition_id)).filter(Boolean);a.innerHTML=`<h2>${view==="have"?"Your collection":"Your wantlist"}</h2>`+(l.map(e=>edRow(e,`<button data-rm="${e.id}" data-k="${view}">Remove</button>`)).join("")||`<p class="sub">Empty for now.</p>`)}
 else if(view==="market"){a.innerHTML=`<h2>Marketplace</h2><p class="note">Listings are real and shared. Payments aren’t built yet, so “Buy” is a placeholder.</p>`+(listings.map(s=>{const e=edById(s.edition_id);return e?edRow(e,`<div><b>$${esc(s.price)}</b><div class="sub">${esc(s.condition)}</div></div>${user&&s.seller_id===user.id?`<button data-unlist="${s.id}">Remove</button>`:`<button data-buy="1">Buy</button>`}`):""}).join("")||"<p>No listings yet.</p>")}
 else if(view==="add"){a.innerHTML=user?`<h2>Add a book</h2><form id="bf"><label>Title<input name="t" required></label><label>Photographer<input name="a" required></label><label>Year<input name="y" type="number" required></label><label>Publisher<input name="p" required></label><label>ISBN (optional)<input name="isbn"></label><label>Cover photo (optional)<input name="c" type="file" accept="image/*"></label><button class="pri">Add to catalog</button></form>`:`<p class="note">Sign in to add books.</p>`}
 else{a.innerHTML=user?`<h2>Account</h2><p>Signed in as ${esc(user.email)}</p><button data-out="1">Sign out</button>`:`<h2>Sign in or create an account</h2><form id="af"><label>Email<input name="e" type="email" required></label><label>Password (6+ characters)<input name="pw" type="password" minlength="6" required></label><div><button class="pri" value="in">Sign in</button> <button value="up">Create account</button></div></form><p class="sub">New accounts may need an email confirmation click before signing in.</p>`}}
document.addEventListener("click",async ev=>{const t=ev.target.closest("[data-go],[data-book],[data-have],[data-want],[data-sell],[data-rm],[data-buy],[data-unlist],[data-out],[data-cover]");if(!t)return;const d=t.dataset;
 try{
 if(d.go)view=d.go;else if(d.book){cur=d.book;view="book"}
 else if(d.out){await sb.auth.signOut();view="browse"}
 else if(d.cover){pendingEd=d.cover;$("#cf").click();return}
 else if(d.buy){toast("Checkout isn’t built yet");return}
 else if(d.have||d.want){if(!user){toast("Sign in first");view="auth";return render()}
  const id=d.have||d.want,k=d.have?"have":"want";
  if(has(id,k)){const r=await sb.from("shelf").delete().match({user_id:user.id,edition_id:id,kind:k});if(r.error)throw r.error}
  else{const r=await sb.from("shelf").insert({user_id:user.id,edition_id:id,kind:k});if(r.error)throw r.error}await refresh();return}
 else if(d.rm){const r=await sb.from("shelf").delete().match({user_id:user.id,edition_id:d.rm,kind:d.k});if(r.error)throw r.error;await refresh();return}
 else if(d.sell){if(!user){toast("Sign in first");view="auth";return render()}
  const p=prompt("Asking price in $?");if(!p||isNaN(p))return;const c=prompt("Condition (e.g. Near Mint, Very Good)?","Very Good")||"Good";
  const r=await sb.from("listings").insert({edition_id:d.sell,seller_id:user.id,price:+p,condition:c});if(r.error)throw r.error;toast("Listed");await refresh();return}
 else if(d.unlist){const r=await sb.from("listings").delete().eq("id",d.unlist);if(r.error)throw r.error;await refresh();return}
 }catch(e){return fail(e)}
 render()});
document.addEventListener("submit",async ev=>{ev.preventDefault();const f=new FormData(ev.target),id=ev.target.id;
 try{
 if(id==="af"){const m=ev.submitter&&ev.submitter.value,c={email:f.get("e"),password:f.get("pw")};
  if(m==="up"){const r=await sb.auth.signUp(c);if(r.error)throw r.error;toast(r.data.session?"Account created":"Check your email to confirm, then sign in")}
  else{const r=await sb.auth.signInWithPassword(c);if(r.error)throw r.error;view="browse"}return}
 if(id==="ef"){const file=f.get("c"),cu=file&&file.size?await uploadCover(file):null;const r=await sb.from("editions").insert({cover_url:cu,book_id:cur,year:+f.get("y"),publisher:f.get("p"),isbn:f.get("isbn")||null,notes:f.get("n")||null,created_by:user.id});if(r.error)throw r.error;toast("Edition added")}
 if(id==="bf"){const file=f.get("c"),cu=file&&file.size?await uploadCover(file):null;const b=await sb.from("books").insert({title:f.get("t"),photographer:f.get("a"),created_by:user.id}).select().single();if(b.error)throw b.error;
  const r=await sb.from("editions").insert({cover_url:cu,book_id:b.data.id,year:+f.get("y"),publisher:f.get("p"),isbn:f.get("isbn")||null,created_by:user.id});if(r.error)throw r.error;cur=b.data.id;view="book";toast("Book added")}
 await refresh()}catch(e){fail(e)}});
$("#cf").addEventListener("change",async e=>{const file=e.target.files[0];e.target.value="";if(!file||!pendingEd||!user)return;try{toast("Uploading…");const url=await uploadCover(file);const r=await sb.from("editions").update({cover_url:url}).eq("id",pendingEd);if(r.error)throw r.error;toast("Cover added");await refresh()}catch(x){fail(x)}});
$("#q").addEventListener("input",e=>{q=e.target.value.trim();view="browse";render()});
sb.auth.onAuthStateChange((_e,s)=>{user=s?s.user:null;refresh()});
sb.auth.getSession().then(({data})=>{user=data.session?data.session.user:null;refresh()});
</script></body></html>
